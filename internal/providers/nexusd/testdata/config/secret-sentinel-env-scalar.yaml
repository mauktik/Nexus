# A catalog env written as a scalar "KEY=VALUE" instead of a mapping: the
# decode error must name the field, never the value.
providers:
  scripts:
    catalog:
      - id: deploy
        description: Deploy the API
        path: /opt/deploy/deploy.sh
        runAs: deploy
        workingDirectory: /opt/deploy
        env: "TOKEN=SENTINEL-7f3a9c-DO-NOT-ECHO"
