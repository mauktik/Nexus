# A catalog env written as a flow mapping holding KEY=VALUE, so the whole
# pair becomes a variable name: the name check must not quote it.
providers:
  scripts:
    catalog:
      - id: deploy
        description: Deploy the API
        path: /opt/deploy/deploy.sh
        runAs: deploy
        workingDirectory: /opt/deploy
        env: {TOKEN=SENTINEL-7f3a9c-DO-NOT-ECHO}
