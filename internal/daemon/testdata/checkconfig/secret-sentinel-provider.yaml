# The same secret with only a provider-level error, so the providers'
# checks run over the section that holds it.
listen: ["127.0.0.1:7443"]
providers:
  docker:
    enabled: true
    socket: "/run/docker.sock://x"
  scripts:
    catalog:
      - id: deploy
        description: Deploy the API
        path: /opt/deploy/deploy.sh
        runAs: deploy
        workingDirectory: /opt/deploy
        env:
          TOKEN: "SENTINEL-7f3a9c-DO-NOT-ECHO"
