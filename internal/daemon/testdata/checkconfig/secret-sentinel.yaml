# A catalog env value is a secret: no report may echo it, whatever else in
# the file is wrong. Here the listen address is invalid, so config.Load
# refuses the file before the providers' checks run.
listen: ["nope"]
providers:
  docker:
    enabled: true
    socket: "/run/docker.sock://x"
  scripts:
    catalog:
      - id: deploy
        description: Deploy the API
        path: /opt/deploy/deploy.sh
        runAs: deploy
        workingDirectory: /opt/deploy
        env:
          TOKEN: "SENTINEL-7f3a9c-DO-NOT-ECHO"
