# Defines upstream @UPSTREAM@ and serves @MARKER@ on @PORT@, its one server.
# upstream-use.conf proxies to it, so disabling this file alone leaves
# nginx -t failing with: host not found in upstream "@UPSTREAM@" (FR-10).
upstream @UPSTREAM@ {
	server 127.0.0.1:@PORT@;
}
server {
	listen @PORT@;
	location / {
		default_type text/plain;
		return 200 "@MARKER@\n";
	}
}
