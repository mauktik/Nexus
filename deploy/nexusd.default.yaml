# nexusd configuration. Install as /etc/nexus/nexusd.yaml, owned by root:root
# with mode 0600: running as root, nexusd refuses the file if any group or
# other permission bit is set, because script env values can be secrets.
# install.sh writes this file there only when no config exists, and never
# changes an existing one.
#
# Every key is listed with its default. Unknown keys are errors.
# Check a change with: nexusd validate-config --config /etc/nexus/nexusd.yaml

host:
  name: ""                   # Empty means the OS hostname

# Loopback only. Exposing nexusd on the LAN is an explicit choice.
listen: ["127.0.0.1:7443"]

# auto generates a self-signed ECDSA P-256 certificate on first start, in
# /var/lib/nexus/tls/ (mode 0600), and logs its SHA-256 fingerprint for client
# pinning; `nexusd tls fingerprint` prints it again. files serves certFile and
# keyFile. off serves plain HTTP and is refused unless every listen address is
# a loopback IP such as 127.0.0.1 or [::1]; 0.0.0.0 and [::] are not, and
# there is no override. TLS 1.2 is the minimum version.
tls:
  mode: auto                 # auto | files | off
  certFile: ""               # Required in files mode, rejected otherwise
  keyFile: ""                # Required in files mode, rejected otherwise
  extraSANs: []              # Extra names or IPs for the generated certificate

limits:
  maxBodyBytes: 1048576
  storageBudgetBytes: 1073741824
  outputCapBytes: 10485760

auth:
  failureLimitPerMinute: 10  # Authentication failures per source

audit:
  retentionDays: 90

mcp:
  allowedOrigins: []

providers:
  # Existing containers on this host's Docker Engine, through its local Unix
  # socket only (API version negotiated): a TCP address or URL is refused,
  # and the socket is never exposed. Every Engine call is bounded at 30s, so
  # an Engine that is down or hung makes only this provider answer
  # dependency-unavailable; nexusd recovers when it returns, with no restart.
  docker:
    enabled: false
    socket: /run/docker.sock   # Absolute path of the Engine's Unix socket
    configDir: /root/.docker   # Registry credentials: only `auths` in config.json is read
    updateHealthTimeout: 60s   # How long an updated container may take to become healthy
    updateMaxRuntime: 1h       # Bound on one container update

  # Packages through the fixed binaries /usr/bin/apt-get, apt-cache,
  # dpkg-query and dpkg, in the C locale, never prompting. Reads list
  # installed and upgradable packages and show one package; refresh runs
  # apt-get update in its own systemd unit, queued behind any other apt
  # operation. Needs apt, dpkg and systemd; without them the provider reports
  # unavailable and the rest of nexusd is unaffected. The upgradable list is
  # cached until the dpkg status, the package indexes, the apt sources or
  # preferences change. Capabilities report whether a reboot is required,
  # from /var/run/reboot-required: unknown when nothing on the host writes it.
  apt:
    enabled: false
    lockWait: 300s           # How long a mutation waits for the dpkg lock
    maxRuntime: 6h           # Bound on one apt operation, after which it reports outcome-unknown

  # The script catalog. Scripts are defined only here: no API, MCP or CLI call
  # can add, change or remove one. Reads return every field except env values,
  # which are listed by name only. A reload (SIGHUP) swaps the whole catalog;
  # a running script keeps the definition it started with.
  #
  # Required per entry: id (letters, digits, ".", "_" and "-", at most 64,
  # starting with a letter or digit), description, path (absolute), runAs and
  # workingDirectory (absolute). Defaults: timeout 1h, concurrency 1,
  # terminationGrace 30s (between SIGTERM and SIGKILL on cancel or timeout).
  # A string parameter requires a pattern. sensitive: true requires env and
  # forbids arg, because argv is visible in /proc. A parameter with neither
  # arg nor env is positional, in declared order. Scripts run only under
  # systemd; without it the provider reports unavailable.
  scripts:
    enabled: false
    catalog: []
    # Example entry:
    # catalog:
    #   - id: deploy-api
    #     description: Pull main and redeploy the API container
    #     path: /opt/deploy/deploy-api.sh
    #     runAs: deploy
    #     workingDirectory: /opt/deploy
    #     timeout: 1h
    #     concurrency: 1
    #     terminationGrace: 30s
    #     env: {PATH: "/home/deploy/.local/bin:/usr/local/bin:/usr/bin:/bin"}
    #     parameters:
    #       - {name: branch, type: string, pattern: '^[A-Za-z0-9._/][A-Za-z0-9._/-]*$', arg: "--branch"}
    #       - {name: apiKey, type: string, pattern: '^[A-Za-z0-9]+$', sensitive: true, env: API_KEY}
